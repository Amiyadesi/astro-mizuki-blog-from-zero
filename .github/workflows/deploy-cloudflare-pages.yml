name: Check and optionally deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE_URL: ${{ vars.SITE_URL || 'https://example.pages.dev' }}
      CF_PAGES_BRANCH: ${{ github.event_name == 'pull_request' && 'preview' || 'main' }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm run check
      - run: pnpm run build
      - run: pnpm run verify-build
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          retention-days: 3

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.CF_PAGES_DEPLOY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PROJECT_NAME: ${{ vars.CLOUDFLARE_PROJECT_NAME }}
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Require deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_PROJECT_NAME SITE_URL; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Set ${name} in repository secrets or variables as documented in README."
              exit 1
            fi
          done
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist
      - name: Deploy the verified artifact to an existing Pages project
        run: npx --yes wrangler@4.111.0 pages deploy dist --project-name "$CLOUDFLARE_PROJECT_NAME" --branch main --commit-hash "$GITHUB_SHA"
